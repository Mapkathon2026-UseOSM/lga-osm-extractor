name: Tests

# Runs the offline unit test suite (no live OSM/network calls) on every
# push and pull request, plus a manual trigger option. This gives anyone
# reviewing the repository (judges, collaborators, future contributors)
# immediate, automated confirmation that the cleaning/export logic works,
# without needing to run anything locally first.
#
# The live-OSM integration test (marked `@pytest.mark.integration` in
# tests/test_extraction.py) is deliberately excluded here, since CI
# runners hitting the Overpass API on every push would be slow, flaky,
# and unkind to a shared public resource. Run it locally with:
#     pytest -m integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Offline unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run offline unit tests
        run: pytest -m "not integration" -v

      - name: Compile check (catch syntax errors in all modules)
        run: python -m py_compile lga_extractor/*.py cli.py app.py
